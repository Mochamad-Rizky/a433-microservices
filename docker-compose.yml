version: '3.7'

services:
  item-app:
    image: ghcr.io/mochamad-rizky/item-app:v1
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - item-db
    environment:
      - DB_HOST=item-db
      - NODE_ENV=production

  item-db:
    image: mongo:3
    restart: always
    volumes:
      - app-db:/data/db

volumes:
  app-db: